name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      reviewer_repository:
        description: Repository that contains the AI reviewer code.
        required: false
        type: string
      reviewer_ref:
        description: Git ref for the AI reviewer repository.
        required: false
        default: main
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: self-hosted
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target-repo
          fetch-depth: 0

      - name: Checkout AI reviewer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.reviewer_repository || github.repository }}
          ref: ${{ inputs.reviewer_ref || github.ref }}
          path: ai-reviewer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reviewer dependencies
        working-directory: ai-reviewer
        run: python -m pip install -r requirements.txt

      - name: Start Ollama embeddings
        working-directory: ai-reviewer
        run: bash scripts/start_project_ollama.sh

      - name: Review pull request
        working-directory: ai-reviewer
        env:
          AGENT_LLM_PROVIDER: ollama
          AGENT_OLLAMA_TIMEOUT_SECONDS: "600"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/review_pr.py \
            --project-path ../target-repo \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --index-file ../project_rag_index.sqlite \
            --output ../pr_review.md

      - name: Publish job summary
        run: cat pr_review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = [
              '<!-- ai-second-code-review -->',
              fs.readFileSync('pr_review.md', 'utf8')
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const previous = comments.data.find(comment => comment.body && comment.body.includes('<!-- ai-second-code-review -->'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
