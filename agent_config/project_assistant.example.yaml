# Project assistant configuration example.
# Copy to agent_config/project_assistant.local.yaml and set a real local path.

project_assistant:
  project_path: /absolute/path/to/project
  docs_paths:
    - README.md
    - project/docs
  index_file: rag/project_rag_index.sqlite

  # Source files used by RAG. For code review this can index any text-based project,
  # while the exclude rules keep runtime folders, binaries, and local secrets out.
  source:
    paths:
      - .
    exclude_dirs:
      - .git
      - .idea
      - .venv
      - __pycache__
      - node_modules
      - build
      - dist
      - rag
      - history
    exclude_globs:
      - "*.local.yaml"
      - "*.local.yml"
      - ".env"
      - "*.env"
      - "*.sqlite"
      - "*.db"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.webp"
      - "*.pdf"
      - "*.zip"
      - "*.tar"
      - "*.gz"
    max_file_bytes: 1000000

  review:
    max_diff_chars: 30000
    max_file_chars: 8000
    top_k: 5
    language: Russian

  github:
    enabled: true
    repository: owner/repo
    token_env: GITHUB_TOKEN
    mcp:
      enabled: false
      server_url: http://localhost:8001
      timeout_seconds: 10

  mcp:
    enabled: false
    server_url: http://localhost:8000
    timeout_seconds: 10

  embedding:
    provider: ollama
    base_url: http://127.0.0.1:11434
    model: nomic-embed-text
    batch_size: 16
    timeout_seconds: 120

  chunking:
    target_tokens: 500
    overlap_tokens: 60
    min_tokens: 40

  retrieval:
    top_k: 5
